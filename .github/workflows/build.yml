name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: unzip -o kairo.zip -d proj
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: cd proj/kairo && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Kairo-APK
          path: proj/kairo/app/build/outputs/apk/debug/*.apk
